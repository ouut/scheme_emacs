<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282c34"/>
      <stop offset="100%" stop-color="#1e2227"/>
    </linearGradient>
    <linearGradient id="emacsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d86e9"/>
      <stop offset="100%" stop-color="#7c5cbf"/>
    </linearGradient>
    <linearGradient id="schemeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51afef"/>
      <stop offset="100%" stop-color="#00e8c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="#3f444a" stroke-width="6" filter="url(#shadow)"/>

  <!-- Subtle outer parenthesis (Strict Paredit) -->
  <path d="M 170 120 C 110 180, 110 332, 170 392" fill="none" stroke="#51afef" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
  <path d="M 342 120 C 402 180, 402 332, 342 392" fill="none" stroke="#51afef" stroke-width="20" stroke-linecap="round" opacity="0.4"/>

  <!-- Emacs Kitchen Sink / Stylized E loop -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#emacsGrad)" stroke-width="24" opacity="0.85"/>

  <!-- Lambda Symbol (λ) -->
  <path d="M 200 370 L 260 210 M 230 250 L 320 370" fill="none" stroke="url(#schemeGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
